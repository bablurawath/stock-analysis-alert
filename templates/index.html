<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STOCK MARKET ALERT - Institutional AI Platform</title>
    <!-- Tailwind CSS (Local Bundle with CDN fallback) -->
    <script src="/static/tailwind.js" onerror="this.onerror=null;this.src='https://cdn.tailwindcss.com';"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- React 18 & ReactDOM (Local Bundle with Cloudflare fallback) -->
    <script src="/static/react.min.js" onerror="this.onerror=null;this.src='https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js';"></script>
    <script src="/static/react-dom.min.js" onerror="this.onerror=null;this.src='https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js';"></script>
    <!-- Babel for in-browser JSX parsing (Local Bundle with Cloudflare fallback) -->
    <script src="/static/babel.min.js" onerror="this.onerror=null;this.src='https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.10/babel.min.js';"></script>
    <style>
        body { background-color: #0b0f19; color: #f3f4f6; }
        .glass-panel { background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-panel:hover { border-color: rgba(59, 130, 246, 0.35); }
        .badge-bullish { background: rgba(16, 185, 129, 0.12); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.25); }
        .badge-bearish { background: rgba(244, 63, 94, 0.12); color: #fb7185; border: 1px solid rgba(244, 63, 94, 0.25); }
        .badge-neutral { background: rgba(245, 158, 11, 0.12); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.25); }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans antialiased selection:bg-blue-500 selection:text-white">
    <div id="root">
        <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0b0f19; color: #9ca3af; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;">
            <div style="width: 48px; height: 48px; border-radius: 12px; background: linear-gradient(135deg, #2563eb, #4f46e5); display: flex; align-items: center; justify-content: center; color: white; font-size: 24px; margin-bottom: 16px; box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.4);">
                ⚡
            </div>
            <div style="font-size: 20px; font-weight: 700; color: #f3f4f6; margin-bottom: 8px;">STOCK MARKET ALERT</div>
            <div style="font-size: 13px; color: #60a5fa; display: flex; align-items: center; gap: 8px;">
                <span>Initializing live institutional AI feed...</span>
            </div>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const APP_TITLE = "STOCK MARKET ALERT";

        // ====================================================================
        // 1. NAVBAR COMPONENT
        // ====================================================================
        function Navbar() {
            return (
                <header className="border-b border-gray-800 bg-gray-900/80 sticky top-0 z-50 backdrop-blur-md">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                        <div className="flex items-center space-x-3">
                            <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center font-bold text-white shadow-lg shadow-blue-500/25">
                                <i className="fa-solid fa-bolt text-lg"></i>
                            </div>
                            <div>
                                <span className="font-extrabold text-lg sm:text-xl tracking-tight text-white">{APP_TITLE}</span>
                                <span className="hidden sm:inline-block ml-3 px-2 py-0.5 rounded-full text-[11px] font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                                    <span className="w-1.5 h-1.5 inline-block mr-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                                    Live 60s Stream
                                </span>
                            </div>
                        </div>
                        <div className="flex items-center space-x-3">
                            <a href="https://t.me/krishstockalert" target="_blank" className="inline-flex items-center space-x-2 bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 text-white px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold shadow-md transition duration-200">
                                <i className="fa-brands fa-telegram text-base"></i>
                                <span>Join Telegram Alerts</span>
                            </a>
                        </div>
                    </div>
                </header>
            );
        }

        // ====================================================================
        // 2. STATS BANNER COMPONENT
        // ====================================================================
        function StatsBanner({ items, fnoCount, onSelectFno, accumulationCount, onSelectAccumulation }) {
            const total = items.length;
            const bullish = items.filter(i => i.sentiment === 'BULLISH').length;
            const highDelivery = items.filter(i => (i.delivery_pct || 0) >= 60).length;

            return (
                <section className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 w-full">
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4">
                        <div className="glass-panel p-4 rounded-xl cursor-pointer hover:border-amber-500/40 transition" onClick={onSelectFno}>
                            <div className="text-amber-400 text-xs font-semibold uppercase tracking-wider flex items-center space-x-1">
                                <i className="fa-solid fa-bolt text-xs"></i>
                                <span>F&O Results Today</span>
                            </div>
                            <div className="text-xl sm:text-2xl font-bold text-amber-300 mt-1 flex items-center space-x-2">
                                <span>{fnoCount}</span>
                                <span className="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30">View Tab</span>
                            </div>
                        </div>
                        <div className="glass-panel p-4 rounded-xl cursor-pointer hover:border-emerald-500/40 transition" onClick={onSelectAccumulation}>
                            <div className="text-emerald-400 text-xs font-semibold uppercase tracking-wider flex items-center space-x-1">
                                <i className="fa-solid fa-gem text-xs"></i>
                                <span>Quality Accumulation</span>
                            </div>
                            <div className="text-xl sm:text-2xl font-bold text-emerald-300 mt-1 flex items-center space-x-2">
                                <span>{accumulationCount || 38}</span>
                                <span className="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">4 Sub-Tabs</span>
                            </div>
                        </div>
                        <div className="glass-panel p-4 rounded-xl">
                            <div className="text-gray-500 text-xs font-semibold uppercase tracking-wider">Tracked Filings</div>
                            <div className="text-xl sm:text-2xl font-bold text-white mt-1">{total}</div>
                        </div>
                        <div className="glass-panel p-4 rounded-xl">
                            <div className="text-gray-500 text-xs font-semibold uppercase tracking-wider">Whale Accumulation</div>
                            <div className="text-xl sm:text-2xl font-bold text-indigo-400 mt-1 flex items-center space-x-1.5">
                                <span>{highDelivery}</span>
                                <i className="fa-solid fa-boxes-packing text-sm"></i>
                            </div>
                        </div>
                    </div>
                </section>
            );
        }

        // ====================================================================
        // 2.5 INSTITUTIONAL QUALITY ACCUMULATION CARD (LARGE, MID, SMALL, MICRO)
        // ====================================================================
        function AccumulationCard({ item, onSelect }) {
            const catColors = {
                LARGE: 'bg-purple-500/15 text-purple-300 border-purple-500/30',
                MID: 'bg-blue-500/15 text-blue-300 border-blue-500/30',
                SMALL: 'bg-teal-500/15 text-teal-300 border-teal-500/30',
                MICRO: 'bg-amber-500/15 text-amber-300 border-amber-500/30'
            };
            const catBadge = catColors[item.category] || 'bg-gray-800 text-gray-300 border-gray-700';

            const scoreColor = item.accumulation_score >= 80 
                ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40' 
                : (item.accumulation_score >= 65 ? 'bg-amber-500/20 text-amber-300 border-amber-500/40' : 'bg-gray-800 text-gray-400 border-gray-700');

            return (
                <div className="glass-panel rounded-2xl p-5 flex flex-col justify-between shadow-xl transition-all duration-200 border border-gray-800/80 hover:border-emerald-500/40 hover:shadow-emerald-950/20">
                    <div>
                        {/* 1. Header Bar: Symbol, Cap Badge, Exchange & Score */}
                        <div className="flex items-start justify-between mb-3 border-b border-gray-800/80 pb-3">
                            <div className="flex-1 mr-2">
                                <div className="flex items-center space-x-2 flex-wrap gap-y-1">
                                    <span className="text-xs font-mono font-black px-2.5 py-0.5 rounded-lg bg-blue-500/10 text-blue-400 border border-blue-500/30 tracking-wide">
                                        {item.symbol}
                                    </span>
                                    <span className={`text-[10px] font-extrabold px-2 py-0.5 rounded-md border ${catBadge}`}>
                                        {item.category} CAP
                                    </span>
                                    <span className="text-[10px] font-mono font-bold px-1.5 py-0.5 rounded bg-gray-900 text-gray-400 border border-gray-800">
                                        {item.exchange}
                                    </span>
                                </div>
                                <h3 className="text-sm font-bold text-white mt-1.5 leading-snug line-clamp-1" title={item.name}>
                                    {item.name}
                                </h3>
                                <p className="text-[11px] text-gray-400 mt-0.5">{item.sector}</p>
                            </div>
                            <div className="text-right flex-shrink-0">
                                <div className="text-base font-mono font-black text-white">
                                    ₹{Number(item.current_price).toLocaleString('en-IN')}
                                </div>
                                <div className={`mt-1 inline-flex items-center space-x-1 text-[10px] font-bold px-2 py-0.5 rounded-md border ${scoreColor}`}>
                                    <span>★ {item.accumulation_score}/100</span>
                                    <span className="text-[9px]">({item.grade})</span>
                                </div>
                            </div>
                        </div>

                        {/* 2. Core Metrics Strip */}
                        <div className="grid grid-cols-4 gap-1.5 p-2 bg-gray-900/60 rounded-xl border border-gray-800/80 text-center text-xs mb-3">
                            <div className="px-1 border-r border-gray-800/80">
                                <div className="text-[10px] text-gray-500 font-medium">Off 52W High</div>
                                <div className="font-mono font-extrabold text-rose-400 mt-0.5 text-xs">
                                    -{item.discount_from_peak}%
                                </div>
                            </div>
                            <div className="px-1 border-r border-gray-800/80">
                                <div className="text-[10px] text-gray-500 font-medium">14-D RSI</div>
                                <div className="font-mono font-bold mt-0.5 text-xs text-emerald-400">
                                    {item.rsi}
                                </div>
                            </div>
                            <div className="px-1 border-r border-gray-800/80">
                                <div className="text-[10px] text-gray-500 font-medium">Delivery %</div>
                                <div className="font-mono font-bold text-gray-200 mt-0.5 text-xs">
                                    {item.delivery_pct}%
                                </div>
                            </div>
                            <div className="px-1">
                                <div className="text-[10px] text-gray-500 font-medium">52W Upside</div>
                                <div className="font-mono font-extrabold text-emerald-400 mt-0.5 text-xs">
                                    +{item.upside ? item.upside.target_upside_pct : 0}%
                                </div>
                            </div>
                        </div>

                        {/* 3. Smart 3-Tranche Staggered Entry Calculator */}
                        {item.tranches && (
                            <div className="mb-3 rounded-xl p-3 bg-gradient-to-b from-gray-900/90 to-gray-950 border border-emerald-500/30 shadow-inner">
                                <div className="flex items-center justify-between text-xs mb-2">
                                    <span className="text-[10px] font-extrabold uppercase tracking-wide text-emerald-300 flex items-center space-x-1">
                                        <i className="fa-solid fa-layer-group text-emerald-400"></i>
                                        <span>3-Tranche Institutional Entry</span>
                                    </span>
                                    <span className="text-[10px] font-mono text-gray-400">
                                        Avg Cost: <strong className="text-white">₹{item.tranches.blended_entry}</strong>
                                    </span>
                                </div>

                                <div className="grid grid-cols-3 gap-1.5 bg-gray-950/90 p-2 rounded-lg border border-gray-800 text-center my-1.5">
                                    <div className="border-r border-gray-800/80 pr-1">
                                        <span className="text-[9px] text-gray-500 block uppercase font-medium">Tranche 1 (40%)</span>
                                        <strong className="text-white font-mono text-xs block mt-0.5">₹{Number(item.tranches.t1_price).toLocaleString('en-IN')}</strong>
                                        <span className="text-[9px] text-blue-400 font-mono block">At CMP</span>
                                    </div>
                                    <div className="border-r border-gray-800/80 px-1">
                                        <span className="text-[9px] text-gray-500 block uppercase font-medium">Tranche 2 (30%)</span>
                                        <strong className="text-amber-300 font-mono text-xs block mt-0.5">₹{Number(item.tranches.t2_price).toLocaleString('en-IN')}</strong>
                                        <span className="text-[9px] text-amber-400/80 font-mono block">S1 Support</span>
                                    </div>
                                    <div className="pl-1">
                                        <span className="text-[9px] text-gray-500 block uppercase font-medium">Tranche 3 (30%)</span>
                                        <strong className="text-emerald-400 font-mono text-xs block mt-0.5">₹{Number(item.tranches.t3_price).toLocaleString('en-IN')}</strong>
                                        <span className="text-[9px] text-emerald-400/80 font-mono block">Deep Value S2</span>
                                    </div>
                                </div>

                                <div className="flex items-center justify-between text-[10px] text-gray-400 mt-1.5 px-0.5 font-medium">
                                    <span>🎯 52W Peak: <strong className="text-emerald-300 font-mono">₹{item.upside ? Number(item.upside.target_price).toLocaleString('en-IN') : item['52w_high']}</strong></span>
                                    <span>⚖️ Risk/Reward: <strong className="text-white font-mono">{item.upside ? item.upside.risk_reward_ratio : '1:3'}</strong></span>
                                </div>
                            </div>
                        )}

                        {/* 4. Past 4-Quarter Business Performance & Growth Trajectory */}
                        <div className="mb-3 rounded-xl p-3 bg-gradient-to-b from-blue-950/20 to-gray-950 border border-blue-500/30">
                            <div className="flex items-center justify-between text-xs mb-2">
                                <span className="text-[10px] font-extrabold uppercase tracking-wide text-blue-300 flex items-center space-x-1.5">
                                    <i className="fa-solid fa-chart-line text-blue-400"></i>
                                    <span>4-Quarter Business Performance &amp; Divergence</span>
                                </span>
                                <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-emerald-500/15 text-emerald-300 border border-emerald-500/30 font-bold">
                                    {item.sales_growth_yoy}
                                </span>
                            </div>

                            <div className="grid grid-cols-2 gap-2 bg-gray-950/80 p-2 rounded-lg border border-gray-800 text-xs mb-2">
                                <div>
                                    <span className="text-[10px] text-gray-500 block font-medium">Profit Growth (PAT)</span>
                                    <strong className="text-emerald-400 font-mono text-xs block mt-0.5">{item.pat_growth_yoy}</strong>
                                </div>
                                <div>
                                    <span className="text-[10px] text-gray-500 block font-medium">Quarterly Profit Trend</span>
                                    <strong className="text-gray-300 font-mono text-[11px] block mt-0.5 truncate" title={item.recent_quarters_trend}>{item.recent_quarters_trend}</strong>
                                </div>
                            </div>

                            <div className="text-[11px] text-gray-300 leading-snug bg-blue-950/30 p-2 rounded-lg border border-blue-500/20">
                                <strong className="text-blue-300">🎯 Business vs Price Divergence:</strong> {item.divergence_note}
                            </div>
                        </div>

                        {/* 5. Promoter Integrity, Pledging & Institutional Footprint */}
                        <div className="mb-3 rounded-xl p-3 bg-gradient-to-b from-emerald-950/20 to-gray-950 border border-emerald-500/30">
                            <div className="flex items-center justify-between text-xs mb-2">
                                <span className="text-[10px] font-extrabold uppercase tracking-wide text-emerald-300 flex items-center space-x-1.5">
                                    <i className="fa-solid fa-shield-halved text-emerald-400"></i>
                                    <span>Promoter Integrity &amp; Ownership Footprint</span>
                                </span>
                                <span className="text-[10px] font-mono px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 font-bold">
                                    0.0% Pledged
                                </span>
                            </div>

                            <div className="space-y-1.5 text-xs">
                                <div className="flex items-center justify-between text-[11px] bg-gray-950/80 p-1.5 rounded border border-gray-800/80">
                                    <span className="text-gray-400">Promoter Stake:</span>
                                    <strong className="text-gray-200 font-mono">{item.promoter_status}</strong>
                                </div>
                                <div className="flex items-center justify-between text-[11px] bg-gray-950/80 p-1.5 rounded border border-gray-800/80">
                                    <span className="text-gray-400">Institutions (DII / MFs):</span>
                                    <strong className="text-indigo-300 font-mono">{item.institution_status}</strong>
                                </div>
                                <div className="flex items-center justify-between text-[11px] bg-gray-950/80 p-1.5 rounded border border-gray-800/80">
                                    <span className="text-gray-400">Capital Efficiency &amp; Debt:</span>
                                    <strong className="text-emerald-300 font-mono">ROCE: {item.roce} | D/E: {item.debt_equity}</strong>
                                </div>
                            </div>

                            <div className="text-[11px] text-gray-400 leading-snug mt-2 pt-2 border-t border-gray-800/80">
                                <strong className="text-emerald-400">🛡️ Promoter Behavior:</strong> {item.promoter_integrity_note}
                            </div>
                        </div>

                        {/* 6. Business Moat & Sentiment Catalyst */}
                        <div className="space-y-1.5 text-xs bg-gray-900/40 p-2.5 rounded-xl border border-gray-800/60 mb-3">
                            <div className="text-[11px] text-gray-300 leading-snug">
                                <strong className="text-blue-400">🏆 Moat:</strong> {item.moat}
                            </div>
                            <div className="text-[11px] text-gray-400 leading-snug">
                                <strong className="text-amber-400">⚠️ Why in Accumulation:</strong> {item.sentiment_catalyst}
                            </div>
                        </div>

                        {/* 7. Whale / Delivery Footprint */}
                        <div className="bg-indigo-950/20 border border-indigo-500/20 rounded-xl px-3 py-1.5 text-xs text-indigo-300 flex items-center space-x-2">
                            <i className="fa-solid fa-boxes-packing text-indigo-400 text-xs"></i>
                            <span className="line-clamp-1 text-[11px] font-medium">{item.whale_note}</span>
                        </div>
                    </div>

                    {/* Footer with Verdict */}
                    <div className="mt-4 pt-3 border-t border-gray-800/80 flex items-center justify-between text-xs">
                        <span className="font-extrabold text-[11px] text-emerald-400 flex items-center space-x-1">
                            <i className="fa-solid fa-shield-heart"></i>
                            <span>{item.verdict}</span>
                        </span>
                        <span className="text-[10px] text-gray-500 font-mono">
                            52W: ₹{item['52w_low']} - ₹{item['52w_high']}
                        </span>
                    </div>
                </div>
            );
        }

        // ====================================================================
        // 3. ULTRA-SIMPLE STOCK CARD WITH DELIVERY & WHALE ACTIVITY
        // ====================================================================
        function StockCard({ item, onSelect }) {
            const badgeClass = item.sentiment === 'BULLISH' 
                ? 'badge-bullish' 
                : (item.sentiment === 'BEARISH' ? 'badge-bearish' : 'badge-neutral');

            const rsiColor = (item.rsi >= 70) 
                ? 'text-rose-400' 
                : ((item.rsi <= 38) ? 'text-emerald-400' : 'text-amber-400');

            const deliveryVal = item.delivery_pct || 52;
            const isHighDelivery = deliveryVal >= 60;

            const formattedSummary = (item.ai_summary || '')
                .replace(/\*\*(.*?)\*\*/g, '$1')
                .replace(/\*(.*?)\*/g, '$1');

            return (
                <div className="glass-panel rounded-2xl p-5 flex flex-col justify-between shadow-xl transition-all duration-200 border border-gray-800/80 hover:border-blue-500/30">
                    <div>
                        {/* 1. Header Bar: Symbol, Status, Name & Price */}
                        <div className="flex items-start justify-between mb-3 border-b border-gray-800/80 pb-3">
                            <div className="flex-1 mr-2">
                                <div className="flex items-center space-x-2 flex-wrap gap-y-1">
                                    <span className="text-xs font-mono font-black px-2.5 py-0.5 rounded-lg bg-blue-500/10 text-blue-400 border border-blue-500/30 tracking-wide">
                                        {item.symbol || 'NSE'}
                                    </span>
                                    {item.result_status && (
                                        <span className={`text-[10px] font-extrabold px-2 py-0.5 rounded-md flex items-center space-x-1 ${item.result_status.includes('DECLARED') ? 'bg-amber-500/20 text-amber-300 border border-amber-500/40' : 'bg-purple-500/20 text-purple-300 border border-purple-500/40'}`}>
                                            <i className={`fa-solid ${item.result_status.includes('DECLARED') ? 'fa-bolt animate-pulse' : 'fa-calendar'}`}></i>
                                            <span>{item.result_status}</span>
                                        </span>
                                    )}
                                </div>
                                <h3 className="text-sm font-bold text-white mt-1.5 leading-snug line-clamp-1" title={item.company_name}>
                                    {item.company_name}
                                </h3>
                            </div>
                            <div className="text-right flex-shrink-0">
                                {item.current_price > 0 && (
                                    <div className="text-base font-mono font-black text-white">
                                        ₹{Number(item.current_price).toLocaleString('en-IN')}
                                    </div>
                                )}
                                <span className={`inline-block text-[10px] font-bold px-2 py-0.5 rounded-md uppercase tracking-wider mt-1 ${badgeClass}`}>
                                    {item.sentiment}
                                </span>
                            </div>
                        </div>

                        {/* 2. Core Metrics Strip: 4-Tile Clean Horizontal Bar */}
                        <div className="grid grid-cols-4 gap-1.5 p-2 bg-gray-900/60 rounded-xl border border-gray-800/80 text-center text-xs mb-3">
                            <div className="px-1 border-r border-gray-800/80">
                                <div className="text-[10px] text-gray-500 font-medium">Delivery</div>
                                <div className="font-mono font-bold mt-0.5 flex items-center justify-center space-x-1">
                                    <span className={`w-1.5 h-1.5 rounded-full ${isHighDelivery ? 'bg-emerald-400' : 'bg-blue-400'}`}></span>
                                    <span className={isHighDelivery ? 'text-emerald-400' : 'text-gray-200'}>{deliveryVal}%</span>
                                </div>
                            </div>
                            <div className="px-1 border-r border-gray-800/80">
                                <div className="text-[10px] text-gray-500 font-medium">Pivots (S1 / R1)</div>
                                <div className="font-mono font-bold text-gray-300 mt-0.5 text-[11px] truncate" title={`S1: ₹${item.support_1} | R1: ₹${item.resistance_1}`}>
                                    ₹{Math.round(item.support_1 || 0)} / ₹{Math.round(item.resistance_1 || 0)}
                                </div>
                            </div>
                            <div className="px-1 border-r border-gray-800/80">

                    const json = await res.json();
                    setAccumulationStocks(json.stocks || []);
                } catch (e) {
                    console.error('Accumulation fetch error:', e);
                } finally {
                    setLoadingAccumulation(false);
                }
            };

            const handleCapChange = (cap) => {
                setAccumulationCategory(cap);
                fetchAccumulationData(cap);
            };

            const getCapCount = (cap) => {
                if (cap === 'ALL') return accumulationStocks.length || 38;
                return accumulationStocks.filter(s => s.category === cap).length;
            };

            const fetchData = async () => {
                setLoading(true);
                try {
                    const [annRes, fnoRes] = await Promise.all([
                        fetch('/api/announcements'),
                        fetch('/api/fno-results/today')
                    ]);
                    const annJson = await annRes.json();
                    const fnoJson = await fnoRes.json();
                    setItems(annJson.announcements || []);
                    setFnoResults(fnoJson.results || []);
                } catch (e) {
                    console.error('Fetch error:', e);
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                fetchData();
                fetchAccumulationData('ALL');
                const interval = setInterval(fetchData, 60000);
                return () => clearInterval(interval);
            }, []);

            // Quick live technical scan on demand (Dual Exchange: NSE & BSE)
            const handleSearchLiveStock = async (query) => {
                const cleanQuery = (query || searchTerm).trim().toUpperCase();
                if (!cleanQuery) return;

                setSearchingLive(true);
                try {
                    const [techRes, volRes] = await Promise.all([
                        fetch(`/api/technicals/${encodeURIComponent(cleanQuery)}`),
                        fetch(`/api/earnings-volatility/${encodeURIComponent(cleanQuery)}`)
                    ]);

                    if (techRes.ok) {
                        const tech = await techRes.json();
                        const vol = volRes.ok ? await volRes.json() : null;

                        const newStockCard = {
                            id: `live_${cleanQuery}_${Date.now()}`,
                            symbol: tech.symbol,
                            company_name: tech.company_name || `${cleanQuery} (${tech.exchange || 'BSE/NSE'})`,
                            subject: `Real-time technical price action, RSI & delivery footprint (${tech.exchange || 'BSE'})`,
                            details: `Current Market Price: ₹${tech.current_price}. 52W Range: ₹${tech['52w_low']} - ₹${tech['52w_high']}`,
                            pdf_url: null,
                            announced_at: 'Live Instant Scan',
                            result_status: tech.exchange === 'BSE' ? 'BSE Listed' : 'NSE Listed',
                            ai_summary: `🎯 Simple Outlook:\n• Exchange: ${tech.exchange || 'BSE'}\n• Price Action: Trading at ₹${tech.current_price}\n• RSI (14): ${tech.rsi} (${tech.rsi_badge})\n• Floor (Support): S1 ₹${tech.pivots.s1}\n• Ceiling (Resistance): R1 ₹${tech.pivots.r1}\n• Historical Volatility: ${vol ? `±${vol.avg_abs_move}%` : 'Standard'}\n• Verdict: ${tech.verdict}`,
                            sentiment: tech.rsi <= 38 ? 'BULLISH' : (tech.rsi >= 70 ? 'BEARISH' : 'NEUTRAL'),
                            current_price: tech.current_price,
                            rsi: tech.rsi,
                            support_1: tech.pivots.s1,
                            resistance_1: tech.pivots.r1,
                            delivery_pct: tech.delivery_pct,
                            whale_note: tech.whale_note,
                            earnings_volatility: vol
                        };

                        setItems(prev => [newStockCard, ...prev.filter(p => p.symbol !== cleanQuery)]);
                        if (activeFilter === 'FNO_TODAY') {
                            setActiveFilter('ALL');
                        }
                        setSearchTerm(cleanQuery);
                    } else {
                        alert(`Could not find live quote for "${cleanQuery}". Please verify the NSE/BSE ticker symbol.`);
                    }
                } catch (err) {
                    console.error('Search error:', err);
                } finally {
                    setSearchingLive(false);
                }
            };

            const filteredItems = useMemo(() => {
                const sourceList = (activeFilter === 'FNO_TODAY') ? fnoResults : items;
                return sourceList.filter(item => {
                    const matchesSearch = 
                        (item.symbol || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
                        (item.company_name || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
                        (item.subject || '').toLowerCase().includes(searchTerm.toLowerCase());

                    if (!matchesSearch) return false;
                    if (activeFilter === 'WHALES') return (item.delivery_pct || 0) >= 60;
                    if (activeFilter === 'BULLISH') return item.sentiment === 'BULLISH';
                    if (activeFilter === 'BEARISH') return item.sentiment === 'BEARISH';
                    return true;
                });
            }, [items, fnoResults, searchTerm, activeFilter]);

            const filteredAccumulation = useMemo(() => {
                return accumulationStocks.filter(item => {
                    const matchesSearch = 
                        (item.symbol || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
                        (item.name || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
                        (item.sector || '').toLowerCase().includes(searchTerm.toLowerCase());
                    if (!matchesSearch) return false;
                    if (accumulationCategory !== 'ALL' && item.category !== accumulationCategory) return false;
                    return true;
                });
            }, [accumulationStocks, searchTerm, accumulationCategory]);

            return (
                <div className="flex-1 flex flex-col">
                    <Navbar />
                    <StatsBanner 
                        items={items} 
                        fnoCount={fnoResults.length} 
                        onSelectFno={() => setActiveFilter('FNO_TODAY')} 
                        accumulationCount={accumulationStocks.length || 38}
                        onSelectAccumulation={() => { setActiveFilter('ACCUMULATION'); fetchAccumulationData(accumulationCategory); }}
                    />

                    {/* Filter & Live Search Bar */}
                    <section className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 pb-6 w-full">
                        <div className="glass-panel rounded-2xl p-4 flex flex-col sm:flex-row items-center gap-3 shadow-xl">
                            <div className="relative flex-1 w-full flex items-center">
                                <i className="fa-solid fa-magnifying-glass absolute left-4 text-gray-500 text-sm"></i>
                                <input 
                                    type="text" 
                                    value={searchTerm} 
                                    onChange={e => setSearchTerm(e.target.value)}
                                    onKeyDown={e => { if (e.key === 'Enter') handleSearchLiveStock(); }}
                                    placeholder="Search ANY NSE or BSE stock (e.g. RELIANCE, BRADYM, TCS, INFY)..."
                                    className="w-full pl-11 pr-24 py-2.5 bg-gray-900/90 border border-gray-700/80 rounded-xl text-sm focus:outline-none focus:border-blue-500 text-white placeholder-gray-500 transition"
                                />
                                {searchTerm.trim() && (
                                    <button 
                                        onClick={() => handleSearchLiveStock()}
                                        disabled={searchingLive}
                                        className="absolute right-1.5 px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-xs font-bold transition flex items-center space-x-1 shadow-md">
                                        {searchingLive ? <i className="fa-solid fa-circle-notch fa-spin"></i> : <i className="fa-solid fa-bolt"></i>}
                                        <span>Scan</span>
                                    </button>
                                )}
                            </div>

                            <div className="flex items-center space-x-2 w-full sm:w-auto overflow-x-auto">
                                <button 
                                    onClick={() => setActiveFilter('ALL')} 
                                    className={`px-3.5 py-2 rounded-xl text-xs font-bold transition whitespace-nowrap ${activeFilter === 'ALL' ? 'bg-blue-600 text-white shadow-md shadow-blue-600/30' : 'bg-gray-800 text-gray-400 hover:text-white'}`}>
                                    All ({items.length})
                                </button>
                                <button 
                                    onClick={() => setActiveFilter('FNO_TODAY')} 
                                    className={`px-3.5 py-2 rounded-xl text-xs font-bold transition flex items-center space-x-1.5 whitespace-nowrap ${activeFilter === 'FNO_TODAY' ? 'bg-gradient-to-r from-amber-500 to-orange-500 text-white shadow-md shadow-amber-500/30' : 'bg-gray-800/90 text-amber-300 hover:text-amber-200 border border-amber-500/30'}`}>
                                    <i className="fa-solid fa-bolt text-xs text-amber-300"></i>
                                    <span>F&O Today</span>
                                    <span className="ml-1 px-1.5 py-0.5 rounded-full text-[10px] bg-black/40 text-amber-200 font-extrabold">{fnoResults.length}</span>
                                </button>
                                <button 
                                    onClick={() => { setActiveFilter('ACCUMULATION'); fetchAccumulationData(accumulationCategory); }} 
                                    className={`px-3.5 py-2 rounded-xl text-xs font-bold transition flex items-center space-x-1.5 whitespace-nowrap ${activeFilter === 'ACCUMULATION' ? 'bg-gradient-to-r from-emerald-500 to-teal-500 text-white shadow-md shadow-emerald-500/30' : 'bg-gray-800/90 text-emerald-300 hover:text-emerald-200 border border-emerald-500/30'}`}>
                                    <i className="fa-solid fa-gem text-xs text-emerald-300"></i>
                                    <span>💎 Quality Accumulation</span>
                                    <span className="ml-1 px-1.5 py-0.5 rounded-full text-[10px] bg-black/40 text-emerald-200 font-extrabold">{accumulationStocks.length || 38}</span>
                                </button>
                                <button 
                                    onClick={() => setActiveFilter('WHALES')} 
                                    className={`px-3.5 py-2 rounded-xl text-xs font-bold transition flex items-center space-x-1.5 whitespace-nowrap ${activeFilter === 'WHALES' ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/30' : 'bg-gray-800 text-gray-400 hover:text-white'}`}>
                                    <i className="fa-solid fa-boxes-packing text-xs"></i>
                                    <span>Whales (&gt;60% Del)</span>
                                </button>
                                <button 
                                    onClick={() => setActiveFilter('BULLISH')} 
                                    className={`px-3.5 py-2 rounded-xl text-xs font-bold transition whitespace-nowrap ${activeFilter === 'BULLISH' ? 'bg-emerald-600 text-white shadow-md shadow-emerald-600/30' : 'bg-gray-800 text-gray-400 hover:text-white'}`}>
                                    Bullish
                                </button>
                                <button 
                                    onClick={() => setActiveFilter('BEARISH')} 
                                    className={`px-3.5 py-2 rounded-xl text-xs font-bold transition whitespace-nowrap ${activeFilter === 'BEARISH' ? 'bg-rose-600 text-white shadow-md shadow-rose-600/30' : 'bg-gray-800 text-gray-400 hover:text-white'}`}>
                                    Bearish
                                </button>
                                <button 
                                    onClick={fetchData} 
                                    className="px-3 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-xl text-xs font-semibold border border-gray-700/80 transition" title="Refresh Feed">
                                    <i className={`fa-solid fa-arrows-rotate ${loading ? 'fa-spin' : ''}`}></i>
                                </button>
                            </div>
                        </div>

                        {/* F&O Context Banner */}
                        {activeFilter === 'FNO_TODAY' && (
                            <div className="mt-4 bg-gradient-to-r from-amber-500/10 via-orange-500/10 to-transparent border border-amber-500/30 rounded-2xl p-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 shadow-lg">
                                <div className="flex items-center space-x-3">
                                    <div className="w-10 h-10 rounded-xl bg-amber-500/20 text-amber-400 flex items-center justify-center font-bold text-lg border border-amber-500/30">
                                        <i className="fa-solid fa-calendar-check"></i>
                                    </div>
                                    <div>
                                        <h4 className="text-sm font-bold text-white flex items-center gap-2">
                                            <span>🌅 Morning Pre-Market F&O Radar ({fnoResults.length} Stocks Scheduled Today)</span>
                                            <span className="text-[10px] px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 font-mono">PRE-MARKET BRIEFING</span>
                                        </h4>
                                        <p className="text-xs text-gray-400 mt-0.5">High-liquidity F&O stocks scheduled for quarterly financial results today with past 4-quarter reaction moves, CMP, RSI, Floor (S1), Ceiling (R1), and Delivery % before results drop.</p>
                                    </div>
                                </div>
                                <div className="flex items-center space-x-2 flex-wrap gap-2">
                                    <div className="text-xs text-amber-300/80 font-mono bg-black/40 px-3 py-1.5 rounded-lg border border-amber-500/20">
                                        Today: {new Date().toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' })}
                                    </div>
                                    <button 
                                        onClick={handleManualBroadcast}
                                        disabled={broadcasting}
                                        className="px-3.5 py-1.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white rounded-xl text-xs font-bold transition flex items-center space-x-1.5 shadow-md shadow-blue-500/20">
                                        <i className={`fa-brands fa-telegram ${broadcasting ? 'fa-circle-notch fa-spin' : ''}`}></i>
                                        <span>{broadcasting ? 'Broadcasting...' : 'Broadcast to Telegram'}</span>
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* Quality Accumulation Sub-Tabs Banner (Large, Mid, Small, Micro) */}
                        {activeFilter === 'ACCUMULATION' && (
                            <div className="mt-4 bg-gradient-to-r from-emerald-500/10 via-teal-500/10 to-transparent border border-emerald-500/30 rounded-2xl p-4 shadow-lg space-y-3">
                                <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
                                    <div className="flex items-center space-x-3">
                                        <div className="w-10 h-10 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center font-bold text-lg border border-emerald-500/30">
                                            <i className="fa-solid fa-gem"></i>
                                        </div>
                                        <div>
                                            <h4 className="text-sm font-bold text-white flex items-center gap-2">
                                                <span>💎 Institutional Quality Accumulation Radar</span>
                                                <span className="text-[10px] px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 font-mono">CASH &amp; DELIVERY</span>
                                            </h4>
                                            <p className="text-xs text-gray-400 mt-0.5">Top-tier businesses with strong moats &amp; high ROCE trading in institutional accumulation zones due to market sentiment or temporary macro dips.</p>
                                        </div>
                                    </div>
                                    <div className="flex items-center space-x-2">
                                        <button 
                                            onClick={() => fetchAccumulationData(accumulationCategory, true)}
                                            disabled={loadingAccumulation}
                                            className="px-3.5 py-1.5 bg-gray-800 hover:bg-gray-700 text-emerald-300 border border-emerald-500/30 rounded-xl text-xs font-bold transition flex items-center space-x-1.5 shadow-md">
                                            <i className={`fa-solid fa-arrows-rotate ${loadingAccumulation ? 'fa-spin' : ''}`}></i>
                                            <span>{loadingAccumulation ? 'Scanning...' : 'Refresh All Baskets'}</span>
                                        </button>
                                    </div>
                                </div>

                                {/* 4 Market Cap Sub-Tabs */}
                                <div className="flex items-center space-x-2 overflow-x-auto pt-2 border-t border-gray-800/80">
                                    <span className="text-[11px] font-bold text-gray-400 uppercase tracking-wide mr-1 flex items-center space-x-1">
                                        <i className="fa-solid fa-layer-group text-xs text-emerald-400"></i>
                                        <span>Market Cap:</span>
                                    </span>
                                    {[
                                        { id: 'ALL', label: 'All Caps', icon: 'fa-globe' },
                                        { id: 'LARGE', label: 'Large Cap', icon: 'fa-landmark' },
                                        { id: 'MID', label: 'Mid Cap', icon: 'fa-chart-line' },
                                        { id: 'SMALL', label: 'Small Cap', icon: 'fa-seedling' },
                                        { id: 'MICRO', label: 'Micro Cap', icon: 'fa-magnifying-glass-chart' }
                                    ].map(cap => (
                                        <button 
                                            key={cap.id}
                                            onClick={() => handleCapChange(cap.id)}
                                            className={`px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center space-x-1.5 whitespace-nowrap ${
                                                accumulationCategory === cap.id 
                                                    ? 'bg-emerald-600 text-white shadow-md shadow-emerald-600/30' 
                                                    : 'bg-gray-900/90 text-gray-400 hover:text-white border border-gray-800'
                                            }`}>
                                            <i className={`fa-solid ${cap.icon} text-[10px]`}></i>
                                            <span>{cap.label}</span>
                                            <span className="ml-1 text-[10px] px-1.5 py-0.2 rounded-full bg-black/40 text-emerald-300 font-mono">
                                                {getCapCount(cap.id)}
                                            </span>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* Quick Stock Chips */}
                        <div className="mt-3 flex items-center space-x-2 overflow-x-auto text-xs text-gray-400">
                            <span className="text-[11px] font-bold text-gray-500 uppercase tracking-wide">Popular Scans:</span>
                            {['RELIANCE', 'TCS', 'INFY', 'HDFCBANK', 'BRADYM', 'TATAMOTORS', 'ICICIBANK', 'CDSL'].map(sym => (
                                <button 
                                    key={sym} 
                                    onClick={() => handleSearchLiveStock(sym)}
                                    className="px-2.5 py-1 rounded-lg bg-gray-900 hover:bg-blue-600/20 text-gray-300 hover:text-blue-300 border border-gray-800 transition font-mono font-semibold">
                                    +{sym}
                                </button>
                            ))}
                        </div>
                    </section>

                    {/* Cards Grid */}
                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-16 flex-1 w-full">
                        {activeFilter === 'ACCUMULATION' ? (
                            loadingAccumulation && accumulationStocks.length === 0 ? (
                                <div className="text-center py-20 text-gray-400">
                                    <i className="fa-solid fa-circle-notch fa-spin text-4xl text-emerald-500 mb-3"></i>
                                    <p className="text-sm font-medium">Scanning institutional quality accumulation baskets across Large, Mid, Small, and Micro caps...</p>
                                </div>
                            ) : filteredAccumulation.length === 0 ? (
                                <div className="glass-panel text-center py-16 rounded-2xl text-gray-500 border border-gray-800 max-w-lg mx-auto p-6">
                                    <i className="fa-solid fa-gem text-emerald-500 text-4xl mb-3"></i>
                                    <p className="text-base font-semibold text-gray-300">
                                        No accumulation stocks found for "{searchTerm}".
                                    </p>
                                    <p className="text-xs text-gray-500 mt-1">
                                        Try switching market cap sub-tabs (Large, Mid, Small, Micro) or clear the search.
                                    </p>
                                </div>
                            ) : (
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {filteredAccumulation.map(item => (
                                        <AccumulationCard key={`${item.category}_${item.symbol}`} item={item} onSelect={setSelectedItem} />
                                    ))}
                                </div>
                            )
                        ) : (
                            loading && items.length === 0 ? (
                                <div className="text-center py-20 text-gray-400">
                                    <i className="fa-solid fa-circle-notch fa-spin text-4xl text-blue-500 mb-3"></i>
                                    <p className="text-sm font-medium">Fetching verified exchange disclosures...</p>
                                </div>
                            ) : filteredItems.length === 0 ? (
                                <div className="glass-panel text-center py-16 rounded-2xl text-gray-500 border border-gray-800 max-w-lg mx-auto p-6">
                                    <i className={`fa-solid ${activeFilter === 'FNO_TODAY' ? 'fa-calendar-xmark text-amber-500' : 'fa-magnifying-glass-chart text-blue-500'} text-4xl mb-3`}></i>
                                    <p className="text-base font-semibold text-gray-300">
                                        {activeFilter === 'FNO_TODAY' ? 'No F&O results matched this query today.' : `"${searchTerm}" is not in recent filings.`}
                                    </p>
                                    <p className="text-xs text-gray-500 mt-1 mb-4">
                                        {activeFilter === 'FNO_TODAY' ? 'F&O results update live as companies submit regulatory board outcomes on NSE/BSE.' : `Click below to fetch instant live price, Delivery %, RSI, and Floor/Ceiling levels for ${searchTerm.toUpperCase()}:`}
                                    </p>
                                    {searchTerm.trim() && (
                                        <button 
                                            onClick={() => handleSearchLiveStock()}
                                            disabled={searchingLive}
                                            className="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-bold transition shadow-lg shadow-blue-500/20">
                                            {searchingLive ? 'Scanning Market...' : `Scan ${searchTerm.toUpperCase()} Live Now`}
                                        </button>
                                    )}
                                </div>
                            ) : (
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {filteredItems.map(item => (
                                        <StockCard key={item.id} item={item} onSelect={setSelectedItem} />
                                    ))}
                                </div>
                            )
                        )}
                    </main>

                    <DetailModal item={selectedItem} onClose={() => setSelectedItem(null)} />

                    <footer className="mt-16 border-t border-gray-800/80 bg-gray-950/90 py-10 px-4 text-xs text-gray-500">
                        <div className="max-w-5xl mx-auto">
                            <div className="flex flex-col md:flex-row items-center justify-between border-b border-gray-800/80 pb-6 mb-6 gap-4">
                                <div className="flex items-center space-x-3">
                                    <div className="w-8 h-8 rounded-lg bg-blue-600/20 border border-blue-500/30 flex items-center justify-center text-blue-400">
                                        <i className="fa-solid fa-shield-halved text-sm"></i>
                                    </div>
                                    <div className="text-left">
                                        <span className="font-bold text-gray-300 text-sm block">{APP_TITLE}</span>
                                        <span className="text-[11px] text-gray-500">Autonomous Financial Intelligence & Regulatory Filing Radar</span>
                                    </div>
                                </div>
                                <div className="flex items-center space-x-2 text-[11px]">
                                    <span className="px-2.5 py-1 rounded-md bg-gray-900 border border-gray-800 text-gray-400 font-mono">
                                        NSE / BSE Feeds
                                    </span>
                                    <span className="px-2.5 py-1 rounded-md bg-gray-900 border border-gray-800 text-gray-400 font-mono">
                                        Gemini 3.5 Flash
                                    </span>
                                </div>
                            </div>

                            {/* Regulatory & Risk Disclaimer Box */}
                            <div className="bg-gray-900/40 rounded-xl p-4 border border-gray-800/60 text-left text-[11px] text-gray-400 leading-relaxed mb-6">
                                <div className="flex items-center space-x-2 text-amber-400 font-bold mb-2 text-xs">
                                    <i className="fa-solid fa-triangle-exclamation"></i>
                                    <span>IMPORTANT REGULATORY & RISK DISCLAIMER</span>
                                </div>
                                <p className="mb-2">
                                    <strong>Non-SEBI Registered Entity:</strong> This platform is an automated educational, computational, and research technology tool analyzing public regulatory filings (NSE/BSE). We are <strong>NOT</strong> a SEBI-registered Investment Advisor (RIA) or Research Analyst. The content, historical volatility statistics, 70-80% strike recommendations, and algorithmic setups provided on this site are for analytical, educational, and information purposes only and must not be construed as investment advice, trading calls, or buy/sell recommendations.
                                </p>
                                <p className="mb-2">
                                    <strong>Derivatives (F&O) Trading Risk:</strong> Trading in Equity Derivatives, Futures, and Options carries significant capital risk and can result in the complete loss of invested capital. As per official SEBI market studies, 9 out of 10 individual traders in the equity F&O segment incur net financial losses. Past historical volatility and quarter reaction trends do not guarantee or predict future market movements.
                                </p>
                                <p>
                                    <strong>Independent Decision Making:</strong> Users are solely responsible for their own investment and trading decisions. Please consult a qualified, SEBI-registered financial advisor before making any financial commitments.
                                </p>
                            </div>

                            <div className="flex flex-col sm:flex-row items-center justify-between text-[11px] text-gray-600 gap-2">
                                <p>© 2026 {APP_TITLE}. All rights reserved.</p>
                                <p className="flex items-center space-x-4">
                                    <span>Real-Time Market Intelligence</span>
                                    <span>•</span>
                                    <span>Strict Educational Compliance</span>
                                </p>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
