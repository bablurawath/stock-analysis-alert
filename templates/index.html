<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STOCK MARKET ALERT - Institutional AI Platform</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- React 18 & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for in-browser JSX parsing -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { background-color: #0b0f19; color: #f3f4f6; }
        .glass-panel { background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-panel:hover { border-color: rgba(59, 130, 246, 0.35); }
        .badge-bullish { background: rgba(16, 185, 129, 0.12); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.25); }
        .badge-bearish { background: rgba(244, 63, 94, 0.12); color: #fb7185; border: 1px solid rgba(244, 63, 94, 0.25); }
        .badge-neutral { background: rgba(245, 158, 11, 0.12); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.25); }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans antialiased selection:bg-blue-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const APP_TITLE = "STOCK MARKET ALERT";

        // ====================================================================
        // 1. NAVBAR COMPONENT
        // ====================================================================
        function Navbar() {
            return (
                <header className="border-b border-gray-800 bg-gray-900/80 sticky top-0 z-50 backdrop-blur-md">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                        <div className="flex items-center space-x-3">
                            <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center font-bold text-white shadow-lg shadow-blue-500/25">
                                <i className="fa-solid fa-bolt text-lg"></i>
                            </div>
                            <div>
                                <span className="font-extrabold text-lg sm:text-xl tracking-tight text-white">{APP_TITLE}</span>
                                <span className="hidden sm:inline-block ml-3 px-2 py-0.5 rounded-full text-[11px] font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                                    <span className="w-1.5 h-1.5 inline-block mr-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                                    Live 60s Stream
                                </span>
                            </div>
                        </div>
                        <div className="flex items-center space-x-3">
                            <a href="https://t.me/krishstockalert" target="_blank" className="inline-flex items-center space-x-2 bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 text-white px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold shadow-md transition duration-200">
                                <i className="fa-brands fa-telegram text-base"></i>
                                <span>Join Telegram Alerts</span>
                            </a>
                        </div>
                    </div>
                </header>
            );
        }

        // ====================================================================
        // 2. STATS BANNER COMPONENT
        // ====================================================================
        function StatsBanner({ items }) {
            const total = items.length;
            const bullish = items.filter(i => i.sentiment === 'BULLISH').length;
            const bearish = items.filter(i => i.sentiment === 'BEARISH').length;

            return (
                <section className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 w-full">
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4">
                        <div className="glass-panel p-4 rounded-xl">
                            <div className="text-gray-500 text-xs font-semibold uppercase tracking-wider">Total Disclosures</div>
                            <div className="text-xl sm:text-2xl font-bold text-white mt-1">{total}</div>
                        </div>
                        <div className="glass-panel p-4 rounded-xl">
                            <div className="text-gray-500 text-xs font-semibold uppercase tracking-wider">Bullish Beats</div>
                            <div className="text-xl sm:text-2xl font-bold text-emerald-400 mt-1 flex items-center space-x-1.5">
                                <span>{bullish}</span>
                                <i className="fa-solid fa-arrow-trend-up text-sm"></i>
                            </div>
                        </div>
                        <div className="glass-panel p-4 rounded-xl">
                            <div className="text-gray-500 text-xs font-semibold uppercase tracking-wider">Bearish / Concerns</div>
                            <div className="text-xl sm:text-2xl font-bold text-rose-400 mt-1 flex items-center space-x-1.5">
                                <span>{bearish}</span>
                                <i className="fa-solid fa-arrow-trend-down text-sm"></i>
                            </div>
                        </div>
                        <div className="glass-panel p-4 rounded-xl">
                            <div className="text-gray-500 text-xs font-semibold uppercase tracking-wider">Smart Money Flow</div>
                            <div className="text-sm sm:text-base font-bold text-indigo-400 mt-1.5 flex items-center space-x-1.5">
                                <span>Quarterly Shift</span>
                                <i className="fa-solid fa-chart-pie text-xs"></i>
                            </div>
                        </div>
                    </div>
                </section>
            );
        }

        // ====================================================================
        // 3. MODULAR BOX-WISE STOCK CARD COMPONENT
        // ====================================================================
        function StockCard({ item, onSelect }) {
            const badgeClass = item.sentiment === 'BULLISH' 
                ? 'badge-bullish' 
                : (item.sentiment === 'BEARISH' ? 'badge-bearish' : 'badge-neutral');

            const rsiColor = (item.rsi >= 70) 
                ? 'text-rose-400' 
                : ((item.rsi <= 35) ? 'text-emerald-400' : 'text-amber-400');

            const formattedSummary = (item.ai_summary || '')
                .replace(/\*\*(.*?)\*\*/g, '$1')
                .replace(/\*(.*?)\*/g, '$1');

            return (
                <div className="glass-panel rounded-2xl p-5 sm:p-6 flex flex-col justify-between shadow-xl transition-all duration-200">
                    <div>
                        {/* BOX 1: Header & Price Action */}
                        <div className="flex items-start justify-between mb-3 border-b border-gray-800 pb-3">
                            <div>
                                <div className="flex items-center space-x-2">
                                    <span className="text-xs font-extrabold px-2.5 py-0.5 rounded-md bg-blue-500/20 text-blue-400 border border-blue-500/30 tracking-wide">
                                        {item.symbol || 'NSE'}
                                    </span>
                                    {item.current_price > 0 && (
                                        <span className="text-sm font-mono font-bold text-gray-200">
                                            ₹{Number(item.current_price).toLocaleString('en-IN')}
                                        </span>
                                    )}
                                </div>
                                <h3 className="text-base font-bold text-white mt-1.5 leading-snug line-clamp-1" title={item.company_name}>
                                    {item.company_name}
                                </h3>
                            </div>
                            <span className={`text-xs font-bold px-2.5 py-1 rounded-lg uppercase tracking-wider ${badgeClass}`}>
                                {item.sentiment}
                            </span>
                        </div>

                        {/* Announcement Headline */}
                        <div className="text-xs font-medium text-gray-400 mb-3 line-clamp-2">
                            <i className="fa-regular fa-file-lines mr-1.5 text-gray-500"></i>
                            {item.subject}
                        </div>

                        {/* BOX 2: Technicals & Pivot Levels Widget */}
                        {item.rsi > 0 && (
                            <div className="mb-4 bg-gray-900/80 rounded-xl p-3 border border-gray-800">
                                <div className="text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-2 flex items-center justify-between">
                                    <span><i className="fa-solid fa-chart-line mr-1 text-blue-400"></i> Technical Levels</span>
                                    <span className={`font-bold ${rsiColor}`}>RSI: {item.rsi}</span>
                                </div>
                                <div className="grid grid-cols-2 gap-2 text-xs">
                                    <div className="bg-gray-950/60 p-2 rounded-lg border border-gray-800/80">
                                        <div className="text-[10px] text-gray-500">Support (S1)</div>
                                        <div className="font-semibold text-emerald-400">₹{Number(item.support_1 || 0).toLocaleString('en-IN')}</div>
                                    </div>
                                    <div className="bg-gray-950/60 p-2 rounded-lg border border-gray-800/80">
                                        <div className="text-[10px] text-gray-500">Resistance (R1)</div>
                                        <div className="font-semibold text-rose-400">₹{Number(item.resistance_1 || 0).toLocaleString('en-IN')}</div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* BOX 3: AI Executive Summary & Key Highlights */}
                        <div className="mb-4">
                            <div className="text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-1.5 flex items-center justify-between">
                                <span><i className="fa-solid fa-robot mr-1 text-indigo-400"></i> AI Intelligence</span>
                                <span className="text-[10px] text-gray-500">Gemini 3.5 Flash</span>
                            </div>
                            <div className="text-xs text-gray-300 bg-gray-950/60 p-3 rounded-xl border border-gray-800/60 max-h-36 overflow-y-auto leading-relaxed whitespace-pre-line">
                                {formattedSummary}
                            </div>
                        </div>

                        {/* BOX 4: Smart Money & Institutional Insight */}
                        {item.smart_money_note && (
                            <div className="mb-4 bg-indigo-950/20 border border-indigo-500/20 rounded-xl p-2.5 text-xs text-indigo-300 flex items-start space-x-2">
                                <i className="fa-solid fa-building-columns text-indigo-400 mt-0.5"></i>
                                <span className="line-clamp-2 leading-tight text-[11px]">{item.smart_money_note}</span>
                            </div>
                        )}
                    </div>

                    {/* BOX 5: Footer Actions */}
                    <div className="pt-3 border-t border-gray-800 flex items-center justify-between text-xs text-gray-400">
                        <span className="text-[11px] text-gray-500">{item.announced_at || 'Recently'}</span>
                        <div className="flex items-center space-x-2">
                            {item.pdf_url && (
                                <a href={item.pdf_url} target="_blank" className="inline-flex items-center space-x-1 px-3 py-1.5 rounded-lg bg-gray-800 hover:bg-gray-700 text-blue-400 font-semibold transition text-xs">
                                    <i className="fa-regular fa-file-pdf"></i>
                                    <span>PDF</span>
                                </a>
                            )}
                            <button onClick={() => onSelect(item)} className="px-3 py-1.5 rounded-lg bg-blue-600/20 hover:bg-blue-600/30 text-blue-300 font-semibold border border-blue-500/30 transition text-xs">
                                360° View
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // ====================================================================
        // 4. MODAL DIALOG COMPONENT (Full 360° Deep-Dive)
        // ====================================================================
        function DetailModal({ item, onClose }) {
            if (!item) return null;

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
                    <div className="glass-panel w-full max-w-2xl rounded-2xl p-6 sm:p-8 max-h-[90vh] overflow-y-auto shadow-2xl border border-gray-700">
                        <div className="flex items-start justify-between border-b border-gray-800 pb-4 mb-5">
                            <div>
                                <span className="text-xs font-bold px-2.5 py-1 rounded bg-blue-500/20 text-blue-400 border border-blue-500/30">{item.symbol}</span>
                                <h2 className="text-xl font-extrabold text-white mt-1.5">{item.company_name}</h2>
                                <p className="text-xs text-gray-400 mt-0.5">{item.subject}</p>
                            </div>
                            <button onClick={onClose} className="w-8 h-8 rounded-lg bg-gray-800 text-gray-400 hover:text-white flex items-center justify-center">
                                <i className="fa-solid fa-xmark"></i>
                            </button>
                        </div>

                        {/* Full AI Analysis */}
                        <div className="mb-6">
                            <h4 className="text-xs font-bold uppercase text-gray-400 mb-2 tracking-wider">Comprehensive AI Breakdown</h4>
                            <div className="bg-gray-950 p-4 rounded-xl border border-gray-800 text-xs sm:text-sm text-gray-200 leading-relaxed whitespace-pre-line">
                                {item.ai_summary}
                            </div>
                        </div>

                        {/* Technical Levels Grid */}
                        <div className="mb-6">
                            <h4 className="text-xs font-bold uppercase text-gray-400 mb-2 tracking-wider">Technical Key Levels</h4>
                            <div className="grid grid-cols-3 gap-3 text-center">
                                <div className="bg-gray-900 p-3 rounded-xl border border-gray-800">
                                    <div className="text-[11px] text-gray-500">RSI (14)</div>
                                    <div className="text-base font-bold text-white mt-0.5">{item.rsi || 'N/A'}</div>
                                </div>
                                <div className="bg-gray-900 p-3 rounded-xl border border-gray-800">
                                    <div className="text-[11px] text-gray-500">Key Support (S1)</div>
                                    <div className="text-base font-bold text-emerald-400 mt-0.5">₹{Number(item.support_1 || 0).toLocaleString('en-IN')}</div>
                                </div>
                                <div className="bg-gray-900 p-3 rounded-xl border border-gray-800">
                                    <div className="text-[11px] text-gray-500">Resistance (R1)</div>
                                    <div className="text-base font-bold text-rose-400 mt-0.5">₹{Number(item.resistance_1 || 0).toLocaleString('en-IN')}</div>
                                </div>
                            </div>
                        </div>

                        <div className="flex items-center justify-end space-x-3 pt-4 border-t border-gray-800">
                            {item.pdf_url && (
                                <a href={item.pdf_url} target="_blank" className="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-bold flex items-center space-x-1.5">
                                    <i className="fa-regular fa-file-pdf"></i>
                                    <span>Download Official Filing</span>
                                </a>
                            )}
                            <button onClick={onClose} className="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-xl text-xs font-semibold">
                                Close
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // ====================================================================
        // 5. MAIN APP COMPONENT
        // ====================================================================
        function App() {
            const [items, setItems] = useState([]);
            const [loading, setLoading] = useState(true);
            const [searchTerm, setSearchTerm] = useState('');
            const [activeFilter, setActiveFilter] = useState('ALL');
            const [selectedItem, setSelectedItem] = useState(null);

            const fetchData = async () => {
                setLoading(true);
                try {
                    const res = await fetch('/api/announcements');
                    const json = await res.json();
                    setItems(json.announcements || []);
                } catch (e) {
                    console.error('Fetch error:', e);
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                fetchData();
                const interval = setInterval(fetchData, 60000); // 60s auto-refresh
                return () => clearInterval(interval);
            }, []);

            const filteredItems = useMemo(() => {
                return items.filter(item => {
                    const matchesSearch = 
                        (item.symbol || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
                        (item.company_name || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
                        (item.subject || '').toLowerCase().includes(searchTerm.toLowerCase());

                    if (!matchesSearch) return false;
                    if (activeFilter === 'BULLISH') return item.sentiment === 'BULLISH';
                    if (activeFilter === 'BEARISH') return item.sentiment === 'BEARISH';
                    return true;
                });
            }, [items, searchTerm, activeFilter]);

            return (
                <div className="flex-1 flex flex-col">
                    <Navbar />
                    <StatsBanner items={items} />

                    {/* Filter & Search Bar */}
                    <section className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 pb-6 w-full">
                        <div className="glass-panel rounded-2xl p-4 flex flex-col sm:flex-row items-center gap-3 shadow-xl">
                            <div className="relative flex-1 w-full">
                                <i className="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-gray-500 text-sm"></i>
                                <input 
                                    type="text" 
                                    value={searchTerm} 
                                    onChange={e => setSearchTerm(e.target.value)}
                                    placeholder="Search by Stock Symbol (e.g. TCS, RELIANCE, INFY) or company..."
                                    className="w-full pl-11 pr-4 py-2.5 bg-gray-900/90 border border-gray-700/80 rounded-xl text-sm focus:outline-none focus:border-blue-500 text-white placeholder-gray-500 transition"
                                />
                            </div>

                            <div className="flex items-center space-x-2 w-full sm:w-auto overflow-x-auto">
                                <button 
                                    onClick={() => setActiveFilter('ALL')} 
                                    className={`px-4 py-2 rounded-xl text-xs font-bold transition ${activeFilter === 'ALL' ? 'bg-blue-600 text-white shadow-md shadow-blue-600/30' : 'bg-gray-800 text-gray-400 hover:text-white'}`}>
                                    All ({items.length})
                                </button>
                                <button 
                                    onClick={() => setActiveFilter('BULLISH')} 
                                    className={`px-4 py-2 rounded-xl text-xs font-bold transition ${activeFilter === 'BULLISH' ? 'bg-emerald-600 text-white shadow-md shadow-emerald-600/30' : 'bg-gray-800 text-gray-400 hover:text-white'}`}>
                                    Bullish
                                </button>
                                <button 
                                    onClick={() => setActiveFilter('BEARISH')} 
                                    className={`px-4 py-2 rounded-xl text-xs font-bold transition ${activeFilter === 'BEARISH' ? 'bg-rose-600 text-white shadow-md shadow-rose-600/30' : 'bg-gray-800 text-gray-400 hover:text-white'}`}>
                                    Bearish
                                </button>
                                <button 
                                    onClick={fetchData} 
                                    className="px-3 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-xl text-xs font-semibold border border-gray-700/80 transition" title="Refresh Feed">
                                    <i className={`fa-solid fa-arrows-rotate ${loading ? 'fa-spin' : ''}`}></i>
                                </button>
                            </div>
                        </div>
                    </section>

                    {/* Cards Grid */}
                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-16 flex-1 w-full">
                        {loading && items.length === 0 ? (
                            <div className="text-center py-20 text-gray-400">
                                <i className="fa-solid fa-circle-notch fa-spin text-4xl text-blue-500 mb-3"></i>
                                <p className="text-sm font-medium">Fetching verified exchange disclosures...</p>
                            </div>
                        ) : filteredItems.length === 0 ? (
                            <div className="glass-panel text-center py-16 rounded-2xl text-gray-500 border border-gray-800">
                                <i className="fa-regular fa-folder-open text-4xl mb-3"></i>
                                <p className="text-base font-semibold text-gray-400">No announcements match your search.</p>
                                <p className="text-xs text-gray-600 mt-1">Try searching a different stock ticker or clearing the filter.</p>
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                {filteredItems.map(item => (
                                    <StockCard key={item.id} item={item} onSelect={setSelectedItem} />
                                ))}
                            </div>
                        )}
                    </main>

                    <DetailModal item={selectedItem} onClose={() => setSelectedItem(null)} />

                    <footer className="border-t border-gray-800/80 py-6 text-center text-xs text-gray-500">
                        <p>© 2026 {APP_TITLE}. AI Equity Intelligence powered by Google Gemini. Educational use only. Not SEBI registered investment advice.</p>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
