<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STOCK MARKET ALERT - Institutional AI Platform</title>
    <!-- Tailwind CSS (Local Bundle with CDN fallback) -->
    <script src="/static/tailwind.js" onerror="this.onerror=null;this.src='https://cdn.tailwindcss.com';"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- React 18 & ReactDOM (Local Bundle with Cloudflare fallback) -->
    <script src="/static/react.min.js" onerror="this.onerror=null;this.src='https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js';"></script>
    <script src="/static/react-dom.min.js" onerror="this.onerror=null;this.src='https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js';"></script>
    <!-- Babel for in-browser JSX parsing (Local Bundle with Cloudflare fallback) -->
    <script src="/static/babel.min.js" onerror="this.onerror=null;this.src='https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.10/babel.min.js';"></script>
    <style>
        body { background-color: #0b0f19; color: #f3f4f6; }
        .glass-panel { background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-panel:hover { border-color: rgba(59, 130, 246, 0.35); }
        .badge-bullish { background: rgba(16, 185, 129, 0.12); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.25); }
        .badge-bearish { background: rgba(244, 63, 94, 0.12); color: #fb7185; border: 1px solid rgba(244, 63, 94, 0.25); }
        .badge-neutral { background: rgba(245, 158, 11, 0.12); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.25); }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans antialiased selection:bg-blue-500 selection:text-white">
    <div id="root">
        <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0b0f19; color: #9ca3af; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;">
            <div style="width: 48px; height: 48px; border-radius: 12px; background: linear-gradient(135deg, #2563eb, #4f46e5); display: flex; align-items: center; justify-content: center; color: white; font-size: 24px; margin-bottom: 16px; box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.4);">
                ⚡
            </div>
            <div style="font-size: 20px; font-weight: 700; color: #f3f4f6; margin-bottom: 8px;">STOCK MARKET ALERT</div>
            <div style="font-size: 13px; color: #60a5fa; display: flex; align-items: center; gap: 8px;">
                <span>Initializing live institutional AI feed...</span>
            </div>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const APP_TITLE = "STOCK MARKET ALERT";

        // ====================================================================
        // 1. NAVBAR COMPONENT
        // ====================================================================
        function Navbar() {
            return (
                <header className="border-b border-gray-800 bg-gray-900/80 sticky top-0 z-50 backdrop-blur-md">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                        <div className="flex items-center space-x-3">
                            <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center font-bold text-white shadow-lg shadow-blue-500/25">
                                <i className="fa-solid fa-bolt text-lg"></i>
                            </div>
                            <div>
                                <span className="font-extrabold text-lg sm:text-xl tracking-tight text-white">{APP_TITLE}</span>
                                <span className="hidden sm:inline-block ml-3 px-2 py-0.5 rounded-full text-[11px] font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                                    <span className="w-1.5 h-1.5 inline-block mr-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                                    Live 60s Stream
                                </span>
                            </div>
                        </div>
                        <div className="flex items-center space-x-3">
                            <a href="https://t.me/krishstockalert" target="_blank" className="inline-flex items-center space-x-2 bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 text-white px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold shadow-md transition duration-200">
                                <i className="fa-brands fa-telegram text-base"></i>
                                <span>Join Telegram Alerts</span>
                            </a>
                        </div>
                    </div>
                </header>
            );
        }

        // ====================================================================
        // 2. STATS BANNER COMPONENT
        // ====================================================================
        function StatsBanner({ items, fnoCount, onSelectFno }) {
            const total = items.length;
            const bullish = items.filter(i => i.sentiment === 'BULLISH').length;
            const highDelivery = items.filter(i => (i.delivery_pct || 0) >= 60).length;

            return (
                <section className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 w-full">
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4">
                        <div className="glass-panel p-4 rounded-xl cursor-pointer hover:border-amber-500/40 transition" onClick={onSelectFno}>
                            <div className="text-amber-400 text-xs font-semibold uppercase tracking-wider flex items-center space-x-1">
                                <i className="fa-solid fa-bolt text-xs"></i>
                                <span>F&O Results Today</span>
                            </div>
                            <div className="text-xl sm:text-2xl font-bold text-amber-300 mt-1 flex items-center space-x-2">
                                <span>{fnoCount}</span>
                                <span className="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30">View Tab</span>
                            </div>
                        </div>
                        <div className="glass-panel p-4 rounded-xl">
                            <div className="text-gray-500 text-xs font-semibold uppercase tracking-wider">Tracked Stocks</div>
                            <div className="text-xl sm:text-2xl font-bold text-white mt-1">{total}</div>
                        </div>
                        <div className="glass-panel p-4 rounded-xl">
                            <div className="text-gray-500 text-xs font-semibold uppercase tracking-wider">Bullish Beats</div>
                            <div className="text-xl sm:text-2xl font-bold text-emerald-400 mt-1 flex items-center space-x-1.5">
                                <span>{bullish}</span>
                                <i className="fa-solid fa-arrow-trend-up text-sm"></i>
                            </div>
                        </div>
                        <div className="glass-panel p-4 rounded-xl">
                            <div className="text-gray-500 text-xs font-semibold uppercase tracking-wider">Whale Accumulation</div>
                            <div className="text-xl sm:text-2xl font-bold text-indigo-400 mt-1 flex items-center space-x-1.5">
                                <span>{highDelivery}</span>
                                <i className="fa-solid fa-boxes-packing text-sm"></i>
                            </div>
                        </div>
                    </div>
                </section>
            );
        }

        // ====================================================================
        // 3. ULTRA-SIMPLE STOCK CARD WITH DELIVERY & WHALE ACTIVITY
        // ====================================================================
        function StockCard({ item, onSelect }) {
            const badgeClass = item.sentiment === 'BULLISH' 
                ? 'badge-bullish' 
                : (item.sentiment === 'BEARISH' ? 'badge-bearish' : 'badge-neutral');

            const rsiColor = (item.rsi >= 70) 
                ? 'text-rose-400' 
                : ((item.rsi <= 38) ? 'text-emerald-400' : 'text-amber-400');

            const deliveryVal = item.delivery_pct || 52;
            const isHighDelivery = deliveryVal >= 60;

            const formattedSummary = (item.ai_summary || '')
                .replace(/\*\*(.*?)\*\*/g, '$1')
                .replace(/\*(.*?)\*/g, '$1');

            return (
                <div className="glass-panel rounded-2xl p-5 sm:p-6 flex flex-col justify-between shadow-xl transition-all duration-200">
                    <div>
                        {/* 1. Header & Price */}
                        <div className="flex items-start justify-between mb-3 border-b border-gray-800 pb-3">
                            <div>
                                <div className="flex items-center space-x-2 flex-wrap gap-y-1">
                                    <span className="text-xs font-extrabold px-2.5 py-0.5 rounded-md bg-blue-500/20 text-blue-400 border border-blue-500/30 tracking-wide">
                                        {item.symbol || 'NSE'}
                                    </span>
                                    {item.result_status && (
                                        <span className={`text-[10px] font-extrabold px-2 py-0.5 rounded-md flex items-center space-x-1 ${item.result_status.includes('DECLARED') ? 'bg-amber-500/20 text-amber-300 border border-amber-500/40' : 'bg-purple-500/20 text-purple-300 border border-purple-500/40'}`}>
                                            <i className={`fa-solid ${item.result_status.includes('DECLARED') ? 'fa-bolt animate-pulse' : 'fa-calendar'}`}></i>
                                            <span>{item.result_status}</span>
                                        </span>
                                    )}
                                    {item.current_price > 0 && (
                                        <span className="text-base font-mono font-bold text-gray-200">
                                            ₹{Number(item.current_price).toLocaleString('en-IN')}
                                        </span>
                                    )}
                                </div>
                                <h3 className="text-base font-bold text-white mt-1 leading-snug line-clamp-1" title={item.company_name}>
                                    {item.company_name}
                                </h3>
                            </div>
                            <span className={`text-xs font-bold px-2.5 py-1 rounded-lg uppercase tracking-wider ${badgeClass}`}>
                                {item.sentiment}
                            </span>
                        </div>

                        {/* 2. Visual Delivery Accumulation Progress Bar */}
                        <div className="mb-3.5 bg-gray-900/90 rounded-xl p-3 border border-gray-800">
                            <div className="flex items-center justify-between text-xs mb-1.5">
                                <span className="text-gray-400 font-semibold flex items-center space-x-1.5">
                                    <i className="fa-solid fa-boxes-packing text-blue-400"></i>
                                    <span>Delivery Accumulation</span>
                                </span>
                                <span className={`font-bold ${isHighDelivery ? 'text-emerald-400' : 'text-gray-300'}`}>
                                    {deliveryVal}%
                                </span>
                            </div>
                            <div className="w-full bg-gray-950 rounded-full h-2 overflow-hidden border border-gray-800">
                                <div 
                                    className={`h-full rounded-full transition-all duration-500 ${isHighDelivery ? 'bg-gradient-to-r from-emerald-500 to-teal-400' : 'bg-gradient-to-r from-blue-500 to-indigo-500'}`}
                                    style={{width: `${Math.min(100, Math.max(10, deliveryVal))}%`}}>
                                </div>
                            </div>
                            <div className="flex items-center justify-between text-[10px] text-gray-500 mt-1">
                                <span>Intraday Churn (30%)</span>
                                <span className={`font-semibold ${isHighDelivery ? 'text-emerald-400' : 'text-gray-400'}`}>
                                    {isHighDelivery ? 'Big Funds Buying 🟢' : 'Routine Flow ⚪'}
                                </span>
                            </div>
                        </div>

                        {/* 3. Who Bought / Who Sold (Whale Activity) */}
                        {item.whale_note && (
                            <div className="mb-3.5 bg-indigo-950/30 border border-indigo-500/25 rounded-xl p-2.5 text-xs text-indigo-300 flex items-start space-x-2">
                                <i className="fa-solid fa-building-columns text-indigo-400 mt-0.5 text-sm"></i>
                                <span className="line-clamp-2 leading-relaxed text-[11px]">{item.whale_note}</span>
                            </div>
                        )}

                        {/* 4. Crystal-Clear Floor & Ceiling Levels */}
                        {item.rsi > 0 && (
                            <div className="mb-3.5 grid grid-cols-3 gap-2 text-center text-xs">
                                <div className="bg-gray-900/80 p-2 rounded-xl border border-gray-800">
                                    <div className="text-[10px] text-gray-500">Floor (S1)</div>
                                    <div className="font-bold text-emerald-400 mt-0.5">₹{Number(item.support_1 || 0).toLocaleString('en-IN')}</div>
                                </div>
                                <div className="bg-gray-900/80 p-2 rounded-xl border border-gray-800">
                                    <div className="text-[10px] text-gray-500">Ceiling (R1)</div>
                                    <div className="font-bold text-rose-400 mt-0.5">₹{Number(item.resistance_1 || 0).toLocaleString('en-IN')}</div>
                                </div>
                                <div className="bg-gray-900/80 p-2 rounded-xl border border-gray-800">
                                    <div className="text-[10px] text-gray-500">RSI (14)</div>
                                    <div className={`font-bold mt-0.5 ${rsiColor}`}>{item.rsi}</div>
                                </div>
                            </div>
                        )}

                        {/* 4B. Historical Earnings Day Volatility (Last 3-4 Quarters) */}
                        {item.earnings_volatility && item.earnings_volatility.quarter_moves && item.earnings_volatility.quarter_moves.length > 0 && (
                            <div className="mb-3.5 bg-gradient-to-br from-gray-900 to-amber-950/20 rounded-xl p-3 border border-amber-500/25">
                                <div className="flex items-center justify-between text-xs mb-2">
                                    <span className="text-gray-300 font-bold flex items-center space-x-1.5">
                                        <i className="fa-solid fa-chart-line text-amber-400"></i>
                                        <span>Result Day Move (Last 4Q)</span>
                                    </span>
                                    <span className="font-extrabold px-2 py-0.5 rounded-md bg-amber-500/20 text-amber-300 border border-amber-500/40 text-[11px]">
                                        Avg: ±{item.earnings_volatility.avg_abs_move}%
                                    </span>
                                </div>

                                {/* 4 Quarter Mini Badges */}
                                <div className="grid grid-cols-4 gap-1.5 text-center">
                                    {item.earnings_volatility.quarter_moves.slice(0, 4).map((q, idx) => {
                                        const qLabel = q.quarter || `Q${idx+1}`;
                                        const dateShort = q.result_date ? q.result_date.split('-').slice(0, 2).join('-') : '';
                                        return (
                                            <div key={idx} className="bg-gray-950/90 p-1.5 rounded-lg border border-gray-800" title={`${qLabel} (${q.result_date}): ${q.timing || 'Reaction'} | ₹${q.base_price} ➔ ₹${q.reaction_price} on ${q.reaction_date}`}>
                                                <div className="text-[9px] text-gray-400 font-medium truncate">
                                                    {qLabel} <span className="text-[8px] text-gray-500">({dateShort})</span>
                                                </div>
                                                <div className={`font-mono font-extrabold text-[11px] mt-0.5 ${q.pct >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                                                    {q.pct > 0 ? `+${q.pct}%` : `${q.pct}%`}
                                                </div>
                                                <div className="text-[8px] text-amber-400/90 font-medium truncate">{q.timing_short || 'T+1'}</div>
                                            </div>
                                        );
                                    })}
                                </div>

                                <div className="flex items-center justify-between text-[10px] text-gray-400 mt-2 pt-1.5 border-t border-gray-800/80">
                                    <span>Net Bias: <strong className={item.earnings_volatility.avg_dir_move >= 0 ? 'text-emerald-400' : 'text-rose-400'}>{item.earnings_volatility.avg_dir_move > 0 ? `+${item.earnings_volatility.avg_dir_move}%` : `${item.earnings_volatility.avg_dir_move}%`}</strong></span>
                                    <span>Expected Swing: <strong className="text-amber-300">±{item.earnings_volatility.avg_abs_move}%</strong></span>
                                </div>

                                {item.earnings_volatility.avg_hr1_move && (
                                    <div className="flex items-center justify-between text-[9px] text-gray-500 mt-1.5 pt-1 border-t border-gray-900 font-mono">
                                        <span>1st Hr Avg: <strong className="text-blue-300">±{item.earnings_volatility.avg_hr1_move}%</strong></span>
                                        <span>4th Hr Avg: <strong className="text-indigo-300">±{item.earnings_volatility.avg_hr4_move}%</strong></span>
                                        <span className="text-amber-400 font-semibold cursor-pointer" onClick={() => onSelect(item)}>360° Hourly ➔</span>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* 4C. High-Probability (70-80%) Strike Recommendation Setup */}
                        {item.strike_setup && item.strike_setup.strategy && (
                            <div className={`mb-3.5 rounded-xl p-3 border ${
                                item.strike_setup.color === 'emerald' 
                                    ? 'bg-gradient-to-br from-emerald-950/40 to-gray-950 border-emerald-500/40' 
                                    : (item.strike_setup.color === 'amber' 
                                        ? 'bg-gradient-to-br from-amber-950/30 to-gray-950 border-amber-500/30' 
                                        : 'bg-gradient-to-br from-rose-950/30 to-gray-950 border-rose-500/30')
                            }`}>
                                <div className="flex items-center justify-between text-xs mb-1.5">
                                    <span className="font-extrabold flex items-center space-x-1.5 text-white">
                                        <i className="fa-solid fa-bullseye text-blue-400"></i>
                                        <span>70-80% Probability Strike Pick</span>
                                    </span>
                                    <span className={`text-[10px] font-mono font-extrabold px-2 py-0.5 rounded border ${
                                        item.strike_setup.color === 'emerald'
                                            ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40'
                                            : (item.strike_setup.color === 'amber'
                                                ? 'bg-amber-500/20 text-amber-300 border-amber-500/40'
                                                : 'bg-rose-500/20 text-rose-300 border-rose-500/40')
                                    }`}>
                                        {item.strike_setup.grade_label}
                                    </span>
                                </div>

                                <div className="bg-gray-950/90 p-2.5 rounded-lg border border-gray-800 text-xs">
                                    <div className="flex items-center justify-between font-bold text-gray-200">
                                        <span className="text-[11px] text-gray-400 font-medium">Recommended:</span>
                                        <span className="text-white font-mono text-[11px]">{item.strike_setup.strategy}</span>
                                    </div>
                                    
                                    {item.strike_setup.grade !== 'AVOID' && (
                                        <div className="mt-2 pt-2 border-t border-gray-800/80 flex items-center justify-between font-mono">
                                            <span className="text-[10px] text-gray-400">Target Strikes:</span>
                                            <span className="font-extrabold text-blue-300 bg-blue-500/10 px-2.5 py-1 rounded-md border border-blue-500/30 text-xs tracking-wide">
                                                {item.strike_setup.strikes_label}
                                            </span>
                                        </div>
                                    )}

                                    <div className="mt-2 pt-1.5 border-t border-gray-800/60 flex items-center justify-between text-[10px] text-gray-400">
                                        <span>Breakeven Move: <strong className="text-amber-300">±{item.strike_setup.breakeven_pct}%</strong></span>
                                        <span>Past 4Q Swing: <strong className="text-emerald-400">±{item.earnings_volatility ? item.earnings_volatility.avg_abs_move : 0}%</strong></span>
                                    </div>
                                </div>

                                <p className="text-[10px] text-gray-400 mt-2 leading-tight">
                                    💡 {item.strike_setup.reason}
                                </p>
                            </div>
                        )}

                        {/* 5. 1-Minute AI Takeaway */}
                        <div className="mb-3">
                            <div className="text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-1 flex items-center justify-between">
                                <span><i className="fa-solid fa-robot mr-1 text-indigo-400"></i> AI Takeaway</span>
                                <span className="text-[10px] text-gray-500">Gemini 3.5</span>
                            </div>
                            <div className="text-xs text-gray-300 bg-gray-950/60 p-3 rounded-xl border border-gray-800/60 max-h-32 overflow-y-auto leading-relaxed whitespace-pre-line">
                                {formattedSummary}
                            </div>
                        </div>
                    </div>

                    {/* Footer Actions */}
                    <div className="pt-3 border-t border-gray-800 flex items-center justify-between text-xs text-gray-400">
                        <span className="text-[11px] text-gray-500">{item.announced_at || 'Recently'}</span>
                        <div className="flex items-center space-x-2">
                            {item.pdf_url && (
                                <a href={item.pdf_url} target="_blank" className="inline-flex items-center space-x-1 px-3 py-1.5 rounded-lg bg-gray-800 hover:bg-gray-700 text-blue-400 font-semibold transition text-xs">
                                    <i className="fa-regular fa-file-pdf"></i>
                                    <span>PDF</span>
                                </a>
                            )}
                            <button onClick={() => onSelect(item)} className="px-3 py-1.5 rounded-lg bg-blue-600/20 hover:bg-blue-600/30 text-blue-300 font-semibold border border-blue-500/30 transition text-xs">
                                360° View
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // ====================================================================
        // 4. MODAL DIALOG COMPONENT (Full 360° Deep-Dive)
        // ====================================================================
        function DetailModal({ item, onClose }) {
            if (!item) return null;

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
                    <div className="glass-panel w-full max-w-2xl rounded-2xl p-6 sm:p-8 max-h-[90vh] overflow-y-auto shadow-2xl border border-gray-700">
                        <div className="flex items-start justify-between border-b border-gray-800 pb-4 mb-5">
                            <div>
                                <span className="text-xs font-bold px-2.5 py-1 rounded bg-blue-500/20 text-blue-400 border border-blue-500/30">{item.symbol}</span>
                                <h2 className="text-xl font-extrabold text-white mt-1.5">{item.company_name}</h2>
                                <p className="text-xs text-gray-400 mt-0.5">{item.subject}</p>
                            </div>
                            <button onClick={onClose} className="w-8 h-8 rounded-lg bg-gray-800 text-gray-400 hover:text-white flex items-center justify-center">
                                <i className="fa-solid fa-xmark"></i>
                            </button>
                        </div>

                        {/* Full AI Analysis */}
                        <div className="mb-6">
                            <h4 className="text-xs font-bold uppercase text-gray-400 mb-2 tracking-wider">Comprehensive AI Breakdown</h4>
                            <div className="bg-gray-950 p-4 rounded-xl border border-gray-800 text-xs sm:text-sm text-gray-200 leading-relaxed whitespace-pre-line">
                                {item.ai_summary}
                            </div>
                        </div>

                        {/* 4-Quarter Historical Earnings Volatility Table */}
                        {item.earnings_volatility && item.earnings_volatility.quarter_moves && item.earnings_volatility.quarter_moves.length > 0 && (
                            <div className="mb-6">
                                <div className="flex items-center justify-between mb-2 flex-wrap gap-2">
                                    <h4 className="text-xs font-bold uppercase text-amber-400 tracking-wider flex items-center gap-1.5">
                                        <i className="fa-solid fa-chart-line"></i>
                                        <span>True Earnings Reaction History (Last 4 Quarters)</span>
                                    </h4>
                                    <span className="text-xs font-mono font-bold px-2.5 py-0.5 rounded-lg bg-amber-500/20 text-amber-300 border border-amber-500/30">
                                        Average Expected Move: ±{item.earnings_volatility.avg_abs_move}%
                                    </span>
                                </div>
                                <div className="bg-gray-950 rounded-xl border border-gray-800 overflow-hidden">
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-xs text-left">
                                            <thead className="bg-gray-900 text-gray-400 uppercase text-[10px] border-b border-gray-800">
                                                <tr>
                                                    <th className="px-3 py-2.5">Quarter</th>
                                                    <th className="px-3 py-2.5">Result Date</th>
                                                    <th className="px-3 py-2.5">Timing</th>
                                                    <th className="px-3 py-2.5">Reaction Day</th>
                                                    <th className="px-3 py-2.5">Pre-Result (₹)</th>
                                                    <th className="px-3 py-2.5">Post-Result (₹)</th>
                                                    <th className="px-3 py-2.5 text-right">True Reaction (%)</th>
                                                </tr>
                                            </thead>

                        {/* Technical & Delivery Indicators */}

                                    <div className="text-[11px] text-gray-500">Floor (S1)</div>

                                    <div className="text-[11px] text-gray-500">Ceiling (R1)</div>

        }

        // ====================================================================
        // 5. MAIN APP COMPONENT
        // ====================================================================
        function App() {
            const [items, setItems] = useState([]);
            const [fnoResults, setFnoResults] = useState([]);
            const [loading, setLoading] = useState(true);
            const [searchingLive, setSearchingLive] = useState(false);
            const [searchTerm, setSearchTerm] = useState('');
            const [activeFilter, setActiveFilter] = useState('ALL');
            const [selectedItem, setSelectedItem] = useState(null);
            const [broadcasting, setBroadcasting] = useState(false);

            const handleManualBroadcast = async () => {
                setBroadcasting(true);
                try {
                    const res = await fetch('/api/broadcast/fno-today?force=true', { method: 'POST' });
                    const json = await res.json();
                    alert(`Telegram Broadcast: ${json.message}`);
                } catch (e) {
                    alert('Broadcast error: ' + e);
                } finally {
                    setBroadcasting(false);
                }
            };

            const fetchData = async () => {
                setLoading(true);
                try {
                    const [annRes, fnoRes] = await Promise.all([
                        fetch('/api/announcements'),
                        fetch('/api/fno-results/today')
                    ]);
                    const annJson = await annRes.json();
                    const fnoJson = await fnoRes.json();
                    setItems(annJson.announcements || []);
                    setFnoResults(fnoJson.results || []);
                } catch (e) {
                    console.error('Fetch error:', e);
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                fetchData();
                const interval = setInterval(fetchData, 60000);
                return () => clearInterval(interval);
            }, []);

            // Quick live technical scan on demand
            const handleSearchLiveStock = async (query) => {
                const cleanQuery = (query || searchTerm).trim().toUpperCase();
                if (!cleanQuery) return;

                setSearchingLive(true);
                try {
                    const [techRes, volRes] = await Promise.all([
                        fetch(`/api/technicals/${encodeURIComponent(cleanQuery)}`),
                        fetch(`/api/earnings-volatility/${encodeURIComponent(cleanQuery)}`)
                    ]);

                    if (techRes.ok) {
                        const tech = await techRes.json();
                        const vol = volRes.ok ? await volRes.json() : null;

                        const newStockCard = {
                            id: `live_${cleanQuery}_${Date.now()}`,
                            symbol: tech.symbol,
                            company_name: `${cleanQuery} (Live Analysis)`,
                            subject: `Real-time technical price action, RSI & delivery footprint`,
                            details: `Current Market Price: ₹${tech.current_price}. 52W Range: ₹${tech['52w_low']} - ₹${tech['52w_high']}`,
                            pdf_url: null,
                            announced_at: 'Live Instant Scan',
                            ai_summary: `🎯 Simple Outlook:\n• Price Action: Trading at ₹${tech.current_price}\n• RSI (14): ${tech.rsi} (${tech.rsi_badge})\n• Floor (Support): S1 ₹${tech.pivots.s1}\n• Ceiling (Resistance): R1 ₹${tech.pivots.r1}\n• Historical 4Q Result Volatility: ${vol ? `±${vol.avg_abs_move}%` : 'Standard'}\n• Verdict: ${tech.verdict}`,
                            sentiment: tech.rsi <= 38 ? 'BULLISH' : (tech.rsi >= 70 ? 'BEARISH' : 'NEUTRAL'),
                            current_price: tech.current_price,
                            rsi: tech.rsi,
                            support_1: tech.pivots.s1,
                            resistance_1: tech.pivots.r1,
                            delivery_pct: tech.delivery_pct,
                            whale_note: tech.whale_note,
                            earnings_volatility: vol
                        };

                        setItems(prev => [newStockCard, ...prev.filter(p => p.symbol !== cleanQuery)]);
                        setSearchTerm(cleanQuery);
                    } else {
                        alert(`Could not find live quote for "${cleanQuery}". Please verify the NSE ticker symbol.`);
                    }
                } catch (err) {
                    console.error('Search error:', err);
                } finally {
                    setSearchingLive(false);
                }
            };

            const filteredItems = useMemo(() => {
                const sourceList = (activeFilter === 'FNO_TODAY') ? fnoResults : items;
                return sourceList.filter(item => {
                    const matchesSearch = 
                        (item.symbol || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
                        (item.company_name || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
                        (item.subject || '').toLowerCase().includes(searchTerm.toLowerCase());

                    if (!matchesSearch) return false;
                    if (activeFilter === 'WHALES') return (item.delivery_pct || 0) >= 60;
                    if (activeFilter === 'BULLISH') return item.sentiment === 'BULLISH';
                    if (activeFilter === 'BEARISH') return item.sentiment === 'BEARISH';
                    return true;
                });
            }, [items, fnoResults, searchTerm, activeFilter]);

            return (
                <div className="flex-1 flex flex-col">
                    <Navbar />
                    <StatsBanner 
                        items={items} 
                        fnoCount={fnoResults.length} 
                        onSelectFno={() => setActiveFilter('FNO_TODAY')} 
                    />

                    {/* Filter & Live Search Bar */}
                    <section className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 pb-6 w-full">
                        <div className="glass-panel rounded-2xl p-4 flex flex-col sm:flex-row items-center gap-3 shadow-xl">
                            <div className="relative flex-1 w-full flex items-center">
                                <i className="fa-solid fa-magnifying-glass absolute left-4 text-gray-500 text-sm"></i>
                                <input 
                                    type="text" 
                                    value={searchTerm} 
                                    onChange={e => setSearchTerm(e.target.value)}
                                    onKeyDown={e => { if (e.key === 'Enter') handleSearchLiveStock(); }}
                                    placeholder="Search ANY stock (e.g. RELIANCE, TCS, INFY, TATAMOTORS, HDFCBANK)..."
                                    className="w-full pl-11 pr-24 py-2.5 bg-gray-900/90 border border-gray-700/80 rounded-xl text-sm focus:outline-none focus:border-blue-500 text-white placeholder-gray-500 transition"
                                />
                                {searchTerm.trim() && (
                                    <button 
                                        onClick={() => handleSearchLiveStock()}
                                        disabled={searchingLive}
                                        className="absolute right-1.5 px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-xs font-bold transition flex items-center space-x-1 shadow-md">
                                        {searchingLive ? <i className="fa-solid fa-circle-notch fa-spin"></i> : <i className="fa-solid fa-bolt"></i>}
                                        <span>Scan</span>
                                    </button>
                                )}
                            </div>

                            <div className="flex items-center space-x-2 w-full sm:w-auto overflow-x-auto">
                                <button 
                                    onClick={() => setActiveFilter('ALL')} 
                                    className={`px-3.5 py-2 rounded-xl text-xs font-bold transition whitespace-nowrap ${activeFilter === 'ALL' ? 'bg-blue-600 text-white shadow-md shadow-blue-600/30' : 'bg-gray-800 text-gray-400 hover:text-white'}`}>
                                    All ({items.length})
                                </button>
                                <button 
                                    onClick={() => setActiveFilter('FNO_TODAY')} 
                                    className={`px-3.5 py-2 rounded-xl text-xs font-bold transition flex items-center space-x-1.5 whitespace-nowrap ${activeFilter === 'FNO_TODAY' ? 'bg-gradient-to-r from-amber-500 to-orange-500 text-white shadow-md shadow-amber-500/30' : 'bg-gray-800/90 text-amber-300 hover:text-amber-200 border border-amber-500/30'}`}>
                                    <i className="fa-solid fa-bolt text-xs text-amber-300"></i>
                                    <span>F&O Results (Today)</span>
                                    <span className="ml-1 px-1.5 py-0.5 rounded-full text-[10px] bg-black/40 text-amber-200 font-extrabold">{fnoResults.length}</span>
                                </button>
                                <button 
                                    onClick={() => setActiveFilter('WHALES')} 
                                    className={`px-3.5 py-2 rounded-xl text-xs font-bold transition flex items-center space-x-1.5 whitespace-nowrap ${activeFilter === 'WHALES' ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/30' : 'bg-gray-800 text-gray-400 hover:text-white'}`}>
                                    <i className="fa-solid fa-boxes-packing text-xs"></i>
                                    <span>Whales (>60% Del)</span>
                                </button>
                                <button 
                                    onClick={() => setActiveFilter('BULLISH')} 
                                    className={`px-3.5 py-2 rounded-xl text-xs font-bold transition whitespace-nowrap ${activeFilter === 'BULLISH' ? 'bg-emerald-600 text-white shadow-md shadow-emerald-600/30' : 'bg-gray-800 text-gray-400 hover:text-white'}`}>
                                    Bullish
                                </button>
                                <button 
                                    onClick={() => setActiveFilter('BEARISH')} 
                                    className={`px-3.5 py-2 rounded-xl text-xs font-bold transition whitespace-nowrap ${activeFilter === 'BEARISH' ? 'bg-rose-600 text-white shadow-md shadow-rose-600/30' : 'bg-gray-800 text-gray-400 hover:text-white'}`}>
                                    Bearish
                                </button>
                                <button 
                                    onClick={fetchData} 
                                    className="px-3 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-xl text-xs font-semibold border border-gray-700/80 transition" title="Refresh Feed">
                                    <i className={`fa-solid fa-arrows-rotate ${loading ? 'fa-spin' : ''}`}></i>
                                </button>
                            </div>
                        </div>

                        {/* F&O Context Banner */}
                        {activeFilter === 'FNO_TODAY' && (
                            <div className="mt-4 bg-gradient-to-r from-amber-500/10 via-orange-500/10 to-transparent border border-amber-500/30 rounded-2xl p-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 shadow-lg">
                                <div className="flex items-center space-x-3">
                                    <div className="w-10 h-10 rounded-xl bg-amber-500/20 text-amber-400 flex items-center justify-center font-bold text-lg border border-amber-500/30">
                                        <i className="fa-solid fa-calendar-check"></i>
                                    </div>
                                    <div>
                                        <h4 className="text-sm font-bold text-white flex items-center gap-2">
                                            <span>🌅 Morning Pre-Market F&O Radar ({fnoResults.length} Stocks Scheduled Today)</span>
                                            <span className="text-[10px] px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 font-mono">PRE-MARKET BRIEFING</span>
                                        </h4>
                                        <p className="text-xs text-gray-400 mt-0.5">High-liquidity F&O stocks scheduled for quarterly financial results today with past 4-quarter reaction moves, CMP, RSI, Floor (S1), Ceiling (R1), and Delivery % before results drop.</p>
                                    </div>
                                </div>
                                <div className="flex items-center space-x-2 flex-wrap gap-2">
                                    <div className="text-xs text-amber-300/80 font-mono bg-black/40 px-3 py-1.5 rounded-lg border border-amber-500/20">
                                        Today: {new Date().toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' })}
                                    </div>
                                    <button 
                                        onClick={handleManualBroadcast}
                                        disabled={broadcasting}
                                        className="px-3.5 py-1.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white rounded-xl text-xs font-bold transition flex items-center space-x-1.5 shadow-md shadow-blue-500/20">
                                        <i className={`fa-brands fa-telegram ${broadcasting ? 'fa-circle-notch fa-spin' : ''}`}></i>
                                        <span>{broadcasting ? 'Broadcasting...' : 'Broadcast to Telegram'}</span>
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* Quick Stock Chips */}
                        <div className="mt-3 flex items-center space-x-2 overflow-x-auto text-xs text-gray-400">
                            <span className="text-[11px] font-bold text-gray-500 uppercase tracking-wide">Popular Scans:</span>
                            {['RELIANCE', 'TCS', 'INFY', 'HDFCBANK', 'TATAMOTORS', 'ICICIBANK', 'SBIN'].map(sym => (
                                <button 
                                    key={sym} 
                                    onClick={() => handleSearchLiveStock(sym)}
                                    className="px-2.5 py-1 rounded-lg bg-gray-900 hover:bg-blue-600/20 text-gray-300 hover:text-blue-300 border border-gray-800 transition font-mono font-semibold">
                                    +{sym}
                                </button>
                            ))}
                        </div>
                    </section>

                    {/* Cards Grid */}
                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-16 flex-1 w-full">
                        {loading && items.length === 0 ? (
                            <div className="text-center py-20 text-gray-400">
                                <i className="fa-solid fa-circle-notch fa-spin text-4xl text-blue-500 mb-3"></i>
                                <p className="text-sm font-medium">Fetching verified exchange disclosures...</p>
                            </div>
                        ) : filteredItems.length === 0 ? (
                            <div className="glass-panel text-center py-16 rounded-2xl text-gray-500 border border-gray-800 max-w-lg mx-auto p-6">
                                <i className={`fa-solid ${activeFilter === 'FNO_TODAY' ? 'fa-calendar-xmark text-amber-500' : 'fa-magnifying-glass-chart text-blue-500'} text-4xl mb-3`}></i>
                                <p className="text-base font-semibold text-gray-300">
                                    {activeFilter === 'FNO_TODAY' ? 'No F&O results matched this query today.' : `"${searchTerm}" is not in recent filings.`}
                                </p>
                                <p className="text-xs text-gray-500 mt-1 mb-4">
                                    {activeFilter === 'FNO_TODAY' ? 'F&O results update live as companies submit regulatory board outcomes on NSE/BSE.' : `Click below to fetch instant live price, Delivery %, RSI, and Floor/Ceiling levels for ${searchTerm.toUpperCase()}:`}
                                </p>
                                {searchTerm.trim() && (
                                    <button 
                                        onClick={() => handleSearchLiveStock()}
                                        disabled={searchingLive}
                                        className="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-bold transition shadow-lg shadow-blue-500/20">
                                        {searchingLive ? 'Scanning Market...' : `Scan ${searchTerm.toUpperCase()} Live Now`}
                                    </button>
                                )}
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                {filteredItems.map(item => (
                                    <StockCard key={item.id} item={item} onSelect={setSelectedItem} />
                                ))}
                            </div>
                        )}
                    </main>

                    <DetailModal item={selectedItem} onClose={() => setSelectedItem(null)} />

                    <footer className="border-t border-gray-800/80 py-6 text-center text-xs text-gray-500">
                        <p>© 2026 {APP_TITLE}. AI Equity Intelligence powered by Google Gemini. Educational use only. Not SEBI registered investment advice.</p>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
